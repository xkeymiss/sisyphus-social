<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sisyphus Social — Kripto Strateji Analizi ve İşlem Paylaşım Platformu">
    <title>{% block title %}Sisyphus Social{% endblock %}</title>
    
    <!-- Google Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/terminal.css') }}?v=4.6">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/social.css') }}?v=4.6">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="app-container">
        {% block content %}{% endblock %}
    </div>

    {% block app_scripts %}
    <!-- Modüler JS -->
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}?v=6.4"></script>
    {% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
